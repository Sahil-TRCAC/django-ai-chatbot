<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: #202123;
            color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        
        .new-chat-btn {
            margin: 20px;
            padding: 12px;
            background: transparent;
            border: 1px solid #4a4b52;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .new-chat-btn:hover {
            background: #2a2b32;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }
        
        .conversation-item {
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .conversation-item:hover {
            background: #2a2b32;
        }
        
        .conversation-item.active {
            background: #343541;
        }
        
        .conversation-title {
            flex: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .delete-conv {
            background: none;
            border: none;
            color: #8e8ea0;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            display: none;
        }
        
        .conversation-item:hover .delete-conv {
            display: inline;
        }
        
        .delete-conv:hover {
            color: #ff4444;
        }
        
        .user-info {
            padding: 20px;
            border-top: 1px solid #2a2b32;
            font-size: 14px;
        }
        
        .logout-btn {
            background: #2a2b32;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #343541;
        }
        
        .chat-header {
            padding: 20px;
            background: #343541;
            border-bottom: 1px solid #40414f;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 24px;
            color: white;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            gap: 20px;
            padding: 20px;
            border-radius: 12px;
        }
        
        .user-message {
            background: #343541;
        }
        
        .ai-message {
            background: #444654;
        }
        
        .message-icon {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .user-icon {
            background: #10a37f;
        }
        
        .ai-icon {
            background: #19c37d;
        }
        
        .message-content {
            flex: 1;
            color: #ececf1;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .input-area {
            padding: 20px;
            background: #343541;
            border-top: 1px solid #40414f;
        }
        
        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        .message-input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            background: #40414f;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            resize: none;
            font-family: inherit;
        }
        
        .message-input:focus {
            outline: none;
        }
        
        .send-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: #19c37d;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .send-btn:hover {
            background: #158f5e;
        }
        
        .typing-indicator {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            color: #8e8ea0;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                transition: left 0.3s;
                z-index: 1000;
                height: 100%;
            }
            
            .sidebar.open {
                left: 0;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        const csrftoken = getCookie('csrftoken');
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
